name: Playwright Tests
on:
  # تشغيل يدوي بس: GitHub ← Actions ← Playwright Tests ← Run workflow
  workflow_dispatch:
    inputs:
      tests:
        description: 'مسار تيستات معين (اختياري) مثال: tests/specs/customers — سيبه فاضي لتشغيل الكل'
        required: false
        default: ''
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # بيوقف الرن من الأول لو أي secret ناقص أو فاضي (بدل ما التيستات تقع بـ 401 مش مفهوم)
    - name: Check test secrets
      env:
        TEST_VALID_EMAIL: ${{ secrets.TEST_VALID_EMAIL }}
        TEST_VALID_PASSWORD: ${{ secrets.TEST_VALID_PASSWORD }}
        TEST_INVALID_EMAIL: ${{ secrets.TEST_INVALID_EMAIL }}
        TEST_INVALID_PASSWORD: ${{ secrets.TEST_INVALID_PASSWORD }}
      run: |
        missing=0
        for name in TEST_VALID_EMAIL TEST_VALID_PASSWORD TEST_INVALID_EMAIL TEST_INVALID_PASSWORD; do
          if [ -z "$(printenv "$name" | tr -d '[:space:]')" ]; then
            echo "::error title=Missing secret::Secret '$name' is missing or empty. Add it in Settings > Secrets and variables > Actions > Repository secrets."
            missing=1
          fi
        done
        exit $missing
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Create test data from secrets
      env:
        VALID_EMAIL: ${{ secrets.TEST_VALID_EMAIL }}
        VALID_PASSWORD: ${{ secrets.TEST_VALID_PASSWORD }}
        INVALID_EMAIL: ${{ secrets.TEST_INVALID_EMAIL }}
        INVALID_PASSWORD: ${{ secrets.TEST_INVALID_PASSWORD }}
      run: |
        node -e "require('fs').writeFileSync('tests/testdata/testdata.json', JSON.stringify({
          validUser: { email: process.env.VALID_EMAIL, password: process.env.VALID_PASSWORD },
          invalidUser: { email: process.env.INVALID_EMAIL, password: process.env.INVALID_PASSWORD }
        }))"
    - name: Run Playwright tests
      env:
        TESTS_PATH: ${{ inputs.tests }}
      run: npx playwright test $TESTS_PATH
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
